name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-prod-dev
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production from main
        uses: actions/checkout@v6
        with:
          ref: main
          path: source-main
          persist-credentials: false
      - name: Checkout development from develop
        uses: actions/checkout@v6
        with:
          ref: develop
          path: source-develop
          persist-credentials: false
      - name: Compose and verify production and development trees
        run: node source-develop/scripts/compose-pages.mjs source-main/docs source-develop/docs artifact
      - name: Verify the unified development route
        run: node source-develop/scripts/check-curriculum.mjs source-develop/docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
